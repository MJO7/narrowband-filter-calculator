name: Publish narrowband calculator

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Validate and prepare static pages
        run: |
          node scripts/build-site.mjs
          mv dist/index.html dist/all-calculators.html
          cp dist/narrowband-filter-calculator.html dist/index.html
          sed -i 's/href="index.html"/href="all-calculators.html"/g' dist/index.html dist/narrowband-filter-calculator.html dist/fov-calculator.html
      - name: Upload static pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
